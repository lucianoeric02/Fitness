name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed only to publish the "apk-latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build web app
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Restore signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "IRONTRACK_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Warn when signing is not configured
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set. The APK will be built to validate the project but will NOT be installable. See docs/ANDROID.md."

      - name: Build release APK
        working-directory: android
        env:
          IRONTRACK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IRONTRACK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IRONTRACK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IRONTRACK_VERSION_CODE: ${{ github.run_number }}
        run: |
          export IRONTRACK_VERSION_NAME="$(node -p "require('../package.json').version")+${{ github.run_number }}"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify signature and name the APK
        if: env.HAS_KEYSTORE == 'true'
        run: |
          set -o pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Signed APK not found at $APK"; ls -la android/app/build/outputs/apk/release/ || true; exit 1; }
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          # apksigner exits non-zero if the APK is unsigned or the signature is invalid.
          # Certificate DN/digests are public information (not secrets).
          "$APKSIGNER" verify --verbose --print-certs "$APK" > apksigner.txt 2>&1 || { cat apksigner.txt; echo "::error::APK signature verification failed"; exit 1; }
          grep -iE "verified using|certificate (DN|SHA-256)" apksigner.txt || cat apksigner.txt
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp "$APK" "out/iron-track-${VERSION}-build${{ github.run_number }}.apk"
          cp "$APK" "out/iron-track.apk"

      - name: Upload APK artifact
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iron-track-apk-build${{ github.run_number }}
          path: out/iron-track-*-build*.apk
          retention-days: 30

      # Fixed download link for the phone:
      # https://github.com/<owner>/<repo>/releases/download/apk-latest/iron-track.apk
      - name: Publish to "apk-latest" release
        if: env.HAS_KEYSTORE == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest out/iron-track.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Iron Track ${VERSION} (build ${{ github.run_number }})" \
            --notes "Build ${{ github.run_number }} from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Instale por cima da versão anterior; seus dados são mantidos."
